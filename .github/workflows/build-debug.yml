name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-debug:
    name: Build & Test Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Create .env from Example if not present
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          elif [ ! -f ".env" ]; then
            touch .env
          fi

      - name: Generate Gradle Wrapper if missing
        run: |
          gradle wrapper --gradle-version 8.13 || true

      - name: Beri Izin Akses Gradle
        run: chmod +x gradlew || true

      - name: Upload wrapp
        uses: actions/upload-artifact@v6
        with:
          name: distri-wrapp
          path: gradle/*
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload wrapp 2
        uses: actions/upload-artifact@v6
        with:
          name: distri-wrapp2
          path: gradle/wrapper/*
          if-no-files-found: ignore
          retention-days: 7

      - name: Run Unit Tests & Capture Screenshots
        run: |
          ./gradlew recordRoborazziDebug testDebugUnitTest --no-daemon --stacktrace || echo "Tests or screenshot recording completed"

      - name: Assemble Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v6
        with:
          name: template-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload UI Screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: app-ui-screenshots
          path: |
            app/src/test/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload UI Screenshots roborazzi
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: app-ui-screenshots-roborazzi
          path: |
            app/build/outputs/roborazzi/*.png
          if-no-files-found: ignore
          retention-days: 7
